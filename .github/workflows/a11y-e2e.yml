name: Accessibility E2E (WCAG 2.2 AA)

on:
  pull_request:
    paths: ['a11y-e2e/**', '.github/workflows/a11y-e2e.yml']
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://www.technerdsng.com
      tags:
        description: Cucumber tag expression
        default: not @known-defect
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: a11y-e2e
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://www.technerdsng.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run accessibility suite
        run: npx cucumber-js --tags "${{ github.event.inputs.tags || 'not @known-defect' }}"
      - name: Export test cases (JSON / XML / JUnit / Excel)
        if: always()
        run: |
          pip install openpyxl
          npm run export
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports
          path: a11y-e2e/reports/
